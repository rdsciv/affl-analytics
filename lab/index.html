<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFFL Lab — Started Points vs NFL EPA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0a;
      color: #e4e4e7;
      padding: 2rem;
      line-height: 1.6;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 3rem;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ff2e9a 0%, #ff6b35 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      color: #a1a1aa;
      font-size: 1.125rem;
    }
    .note {
      background: #18181b;
      border-left: 3px solid #ff2e9a;
      padding: 1rem 1.5rem;
      margin-bottom: 2rem;
      border-radius: 0.5rem;
    }
    .note p {
      color: #d4d4d8;
    }
    .note code {
      background: #27272a;
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 2rem;
      color: #a1a1aa;
      text-decoration: none;
      font-size: 0.875rem;
    }
    .back-link:hover {
      color: #ff2e9a;
    }
  </style>
</head>
