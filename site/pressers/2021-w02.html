<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">AFFL Presser</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2724%27 fill=%27%2393d500%27/%3E%3Ctext x=%2750%27 y=%2772%27 font-size=%2762%27 font-weight=%27bold%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27%3EC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="frame">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" style="border-color: var(--green); box-shadow: 0 0 18px #93d50088, inset 0 0 14px #93d50033;">C</div>
      <div>
        <h1>Commissioner <span>Pressers</span></h1>
        <div class="sub" id="presser-subtitle">weekly recap</div>
      </div>
    </div>
    <nav class="site-nav">
      <a href="../index.html">Dashboard</a>
      <a href="../scoreboard.html">Scoreboard</a>
      <a href="../players.html">Players</a>
      <a href="../draft.html">Draft</a>
      <a href="../trades.html">Trades</a>
      <a href="../pressers.html" class="on">Pressers</a>
    </nav>
  </header>

  <section class="card">
    <div class="card-head">
      <div>
        <h2 id="presser-title">Loading...</h2>
      </div>
    </div>

    <div class="presser-nav" id="presser-nav" style="margin-bottom: 16px;"></div>

    <article id="presser-content" class="presser-content">
      <p style="color: var(--mut); font-style: italic;">Loading presser...</p>
    </article>
  </section>

  <footer class="foot">AFFL Commissioner Pressers &middot; preserved as originally written</footer>
</div>

<style>
.presser-nav {
  display: flex; gap: 10px; align-items: center; padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.presser-nav a {
  display: inline-block; padding: 6px 12px; border-radius: 7px;
  border: 1px solid var(--line); background: transparent;
  color: var(--mut); text-decoration: none; font-size: 11.5px;
  font-weight: 700; transition: all .15s;
}
.presser-nav a:hover { color: var(--ice); border-color: var(--blue); }
.presser-nav a.disabled {
  opacity: 0.3; pointer-events: none;
}
.presser-nav .sep {
  flex: 1; text-align: center; color: #46536b; font-size: 12px;
}

.presser-content {
  color: var(--ink); font-size: 13.5px; line-height: 1.7;
}
.presser-content h3 {
  font-size: 14px; font-weight: 900; font-style: italic;
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--orange); margin: 22px 0 10px;
}
.presser-content h3:first-child { margin-top: 0; }
.presser-content p { margin: 12px 0; }
.presser-content ol {
  margin: 12px 0; padding-left: 24px;
}
.presser-content li {
  margin: 8px 0; line-height: 1.6;
}
.presser-content strong { color: var(--yellow); font-weight: 700; }
.presser-content em { color: var(--blue2); font-style: italic; }
</style>

<script>
(async function() {
  const slug = window.location.pathname.split('/').pop().replace('.html', '');
  
  try {
    const res = await fetch('pressers.json?v=2');
    const data = await res.json();
    const pressers = data.pressers;
    
    const idx = pressers.findIndex(p => p.slug === slug);
    if (idx === -1) {
      document.getElementById('presser-content').innerHTML = 
        '<p style="color: var(--red);">Presser not found.</p>';
      return;
    }
    
    const presser = pressers[idx];
    document.getElementById('page-title').textContent = presser.title + ' — AFFL Presser';
    document.getElementById('presser-title').textContent = presser.title;
    document.getElementById('presser-subtitle').textContent = presser.title + ' recap';
    
    if (!presser.body || presser.body.trim() === '') {
      document.getElementById('presser-content').innerHTML = 
        '<p style="color: var(--mut); font-style: italic;">Content coming soon.</p>';
    } else {
      const rendered = parsePresserBody(presser.body);
      document.getElementById('presser-content').innerHTML = rendered;
    }
    
    const nav = document.getElementById('presser-nav');
    const prevPresser = idx > 0 ? pressers[idx - 1] : null;
    const nextPresser = idx < pressers.length - 1 ? pressers[idx + 1] : null;
    
    nav.innerHTML = 
      (prevPresser 
        ? '<a href="' + prevPresser.slug + '.html">← ' + prevPresser.title + '</a>' 
        : '<a class="disabled">← Previous</a>') +
      '<div class="sep"><a href="../pressers.html" style="border: none; padding: 0;">Archive</a></div>' +
      (nextPresser 
        ? '<a href="' + nextPresser.slug + '.html">' + nextPresser.title + ' →</a>' 
        : '<a class="disabled">Next →</a>');
  } catch (err) {
    console.error(err);
    document.getElementById('presser-content').innerHTML = 
      '<p style="color: var(--red);">Error loading presser.</p>';
  }
})();

function parsePresserBody(body) {
  if (!body) return '';
  
  let html = '';
  const lines = body.split('\n');
  let inList = false;
  
  for (let line of lines) {
    line = line.trim();
    if (!line) {
      if (inList) {
        html += '</ol>';
        inList = false;
      }
      continue;
    }
    
    if (line.match(/^(TIER|TOP|MIDDLE|BOTTOM|ELITE|CONTENDERS|PLAYOFF|BUBBLE)/i) && line.length < 60) {
      if (inList) {
        html += '</ol>';
        inList = false;
      }
      html += '<h3>' + line + '</h3>';
    }
    else if (line.match(/^\d+[.)]\s/)) {
      if (!inList) {
        html += '<ol>';
        inList = true;
      }
      const content = line.replace(/^\d+[.)]\s+/, '');
      html += '<li>' + content + '</li>';
    }
    else {
      if (inList) {
        html += '</ol>';
        inList = false;
      }
      html += '<p>' + line + '</p>';
    }
  }
  
  if (inList) {
    html += '</ol>';
  }
  
  return html;
}
</script>

</body>
</html>
